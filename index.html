<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#030306">
  <meta name="description" content="A sparkling Happy Diwali greeting with colorful animated fireworks.">
  <title>Happy Diwali | Festival of Lights</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="scene">
    <canvas id="fireworks" aria-hidden="true"></canvas>
    <div class="vignette" aria-hidden="true"></div>
    <section class="greeting" aria-label="Diwali greeting">
      <p class="eyebrow">THE FESTIVAL OF LIGHTS</p>
      <h1>Happy Diwali</h1>
      <p class="subtitle">May your life shine with joy, peace &amp; prosperity</p>
      <button id="wishButton" type="button">WISHING YOU A FESTIVAL OF LIGHTS</button>
      <p class="hint" id="hint">Click anywhere to launch fireworks</p>
    </section>
    <div class="footer">✦ &nbsp; LIGHT • LOVE • HAPPINESS &nbsp; ✦</div>
  </main>
  <script src="script.js"></script>
</body>
</html>
